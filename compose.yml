services:
  mysql:
    image: mysql:8.4
    labels:
      org.springframework.boot.jdbc.parameters: "serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-error_alert}
      MYSQL_USER: ${MYSQL_USER:-error_alert}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-replace_with_dev_mysql_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace_with_dev_mysql_root_password}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
  redis-data:
