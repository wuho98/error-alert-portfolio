spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:error_alert;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false
